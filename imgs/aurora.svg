<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 258" width="460" height="258" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#527bbd"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d08a3a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="459" height="257" rx="10" fill="#ffffff" stroke="#dde4ee"/>

  <!-- inputs -->
  <g stroke="#9db0cf" fill="#f7f9fc">
    <rect x="12" y="46" width="104" height="44" rx="6"/>
    <rect x="12" y="102" width="104" height="44" rx="6"/>
  </g>
  <circle cx="30" cy="62" r="5.5" fill="#527bbd"/>
  <path d="M19,82 C19,71 41,71 41,82 Z" fill="#527bbd"/>
  <text x="50" y="65" font-size="10.5" fill="#222">One</text>
  <text x="50" y="78" font-size="10.5" fill="#222">photograph</text>
  <g stroke="#d08a3a" stroke-width="2.2" stroke-linecap="round">
    <line x1="21" y1="120" x2="21" y2="128"/>
    <line x1="26" y1="114" x2="26" y2="134"/>
    <line x1="31" y1="118" x2="31" y2="130"/>
    <line x1="36" y1="109" x2="36" y2="139"/>
    <line x1="41" y1="117" x2="41" y2="131"/>
  </g>
  <text x="50" y="120" font-size="10.5" fill="#222" font-weight="bold">One speech</text>
  <text x="50" y="133" font-size="10.5" fill="#222">track</text>

  <path d="M116,68 C136,68 136,88 150,88" stroke="#527bbd" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M116,124 L150,124" stroke="#d08a3a" stroke-width="1.8" fill="none" marker-end="url(#aro)"/>

  <!-- the stack -->
  <rect x="152" y="36" width="136" height="152" rx="8" fill="#eef3fb" stroke="#527bbd" stroke-width="1.6"/>
  <text x="220" y="56" font-size="12.5" font-weight="bold" fill="#224b8d" text-anchor="middle">Aurora</text>
  <text x="220" y="71" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">audio-driven video generation</text>
  <g>
    <rect x="166" y="80" width="108" height="19" rx="3" fill="#ffffff" stroke="#a9bcd8"/>
    <text x="220" y="93" font-size="8.5" fill="#333" text-anchor="middle">identity preservation</text>
    <rect x="166" y="103" width="108" height="19" rx="3" fill="#fdf0e0" stroke="#d08a3a" stroke-width="1.3"/>
    <text x="220" y="116" font-size="8.5" font-weight="bold" fill="#8a5a22" text-anchor="middle">speech-aligned motion</text>
    <rect x="166" y="126" width="108" height="19" rx="3" fill="#ffffff" stroke="#a9bcd8"/>
    <text x="220" y="139" font-size="8.5" fill="#333" text-anchor="middle">expression &amp; gesture</text>
  </g>
  <text x="220" y="163" font-size="9" fill="#8a5a22" text-anchor="middle" font-style="italic">speech is the temporal backbone,</text>
  <text x="220" y="175" font-size="9" fill="#8a5a22" text-anchor="middle" font-style="italic">not a side channel</text>

  <path d="M288,112 L308,112" stroke="#527bbd" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- output -->
  <rect x="310" y="36" width="136" height="152" rx="8" fill="#f7f9fc" stroke="#9db0cf"/>
  <rect x="350" y="48" width="56" height="34" rx="4" fill="#ffffff" stroke="#527bbd" stroke-width="1.3"/>
  <path d="M370,57 L386,65 L370,73 z" fill="#527bbd"/>
  <text x="378" y="100" font-size="11.5" font-weight="bold" fill="#224b8d" text-anchor="middle">A lifelike person</text>
  <g font-size="9.5" fill="#333" text-anchor="middle">
    <text x="378" y="120">speech &#8594; articulation</text>
    <text x="378" y="134">tone &#8594; gaze, gesture,</text>
    <text x="378" y="147">head motion, expression</text>
  </g>
  <line x1="326" y1="158" x2="430" y2="158" stroke="#dde4ee"/>
  <text x="378" y="175" font-size="9.5" fill="#555" text-anchor="middle">continuous over long utterances</text>

  <!-- public stats -->
  <g font-size="10" fill="#444" text-anchor="middle">
    <text x="230" y="212">Speech drives articulation, expression, and motion</text>
  </g>
  <text x="230" y="232" font-size="10.5" fill="#777" text-anchor="middle">Long-form consistency beyond a single generation window</text>
  <text x="230" y="248" font-size="9.5" fill="#999" text-anchor="middle" font-style="italic">one image + one speech track &#8594; a reactive avatar</text>
</svg>
